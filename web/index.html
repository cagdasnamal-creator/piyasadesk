<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PiyasaDesk</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141417">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PiyasaDesk">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f7f7f8; --panel:#ffffff; --border:#e3e3e6; --text:#1a1a1c;
    --muted:#6b6b72; --accent:#1f6feb; --reg:#7a3ea3; --media:#0a7c5a;
    --warn:#b7791f; --bad:#c23b3b; --good:#0a7c5a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141417; --panel:#1c1c20; --border:#2e2e34; --text:#e9e9ec;
      --muted:#9a9aa2; --accent:#5a9dff; --reg:#c08ae0; --media:#4ecfa3;
      --warn:#e0b050; --bad:#ff7b7b; --good:#4ecfa3;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141417; --panel:#1c1c20; --border:#2e2e34; --text:#e9e9ec;
    --muted:#9a9aa2; --accent:#5a9dff; --reg:#c08ae0; --media:#4ecfa3;
    --warn:#e0b050; --bad:#ff7b7b; --good:#4ecfa3;
  }
  *{box-sizing:inherit}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px}

  .searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  input[type=text]{
    flex:1 1 220px;min-width:0;padding:11px 13px;border-radius:9px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    font-size:16px;text-transform:uppercase;letter-spacing:.5px;
  }
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{
    padding:11px 15px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .tab{
    padding:7px 14px;border-radius:9px 9px 0 0;border:1px solid var(--border);
    border-bottom:2px solid transparent;background:var(--panel);cursor:pointer;
    font-size:14px;color:var(--muted);
  }
  .tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .tab.add{border-style:dashed;color:var(--accent)}
  .tab .tab-actions{display:inline-flex;gap:2px;margin-left:7px;vertical-align:middle}
  .tab .tab-action{
    padding:1px 4px;border:0;background:transparent;color:var(--muted);
    font-size:13px;line-height:1;opacity:.55;border-radius:4px;
  }
  .tab:hover .tab-action,.tab.on .tab-action{opacity:.9}
  .tab .tab-action:hover{color:var(--accent);background:rgba(255,255,255,.06)}
  .tab .tab-action.delete:hover{color:var(--bad)}

  dialog{
    border:1px solid var(--border);border-radius:12px;background:var(--panel);
    color:var(--text);padding:18px;max-width:440px;width:92%;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 10px;font-size:16px}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  dialog input,dialog textarea{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
  }
  dialog textarea{min-height:90px;text-transform:uppercase;resize:vertical}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .dlg-err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{
    padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);cursor:pointer;font-size:13px;color:var(--muted);
  }
  .chip.on{border-color:var(--accent);color:var(--accent)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
  .filterbox{
    display:flex;gap:7px;align-items:center;padding:5px 9px;border:1px solid var(--border);
    border-radius:9px;background:var(--panel);font-size:12.5px;color:var(--muted);
  }
  .filterbox select{
    border:0;background:transparent;color:var(--text);font:inherit;outline:none;cursor:pointer;
    max-width:210px;
  }
  .filterbox option{background:var(--panel);color:var(--text)}
  .filter-note{font-size:11.5px;color:var(--muted)}

  .health{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:11px 13px;margin-bottom:16px;font-size:13px;
  }
  .health-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .HEALTHY{background:var(--good)} .DEGRADED{background:var(--warn)} .UNHEALTHY{background:var(--bad)}
  .health details{margin-top:8px}
  .health summary{cursor:pointer;color:var(--muted)}
  .srcline{padding:3px 0;color:var(--muted);font-size:12.5px}

  .item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:13px 15px;margin-bottom:9px;
  }
  .item.unseen{border-left:3px solid var(--accent)}
  .badge.yeni{color:var(--accent);border-color:var(--accent);font-weight:600}
  .badge.ROUTINE{opacity:.6}
  .item a.title{color:var(--text);text-decoration:none;font-weight:600;font-size:15.5px}
  .item a.title:hover{color:var(--accent)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:12px}
  .badge{padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  /* Renk HIYERARSISI:
     - REGULATORY (KAP) = belirgin mor. Yasal bildirim, farkli guven seviyesi.
     - MEDIA = kaynak basina AYRI ama SOLUK tonlar. Taramayi kolaylastirir
       ama "mor = resmi" refleksini bozmaz. */
  .badge.REGULATORY{color:var(--reg);border-color:var(--reg);font-weight:600}
  .badge.MEDIA{color:var(--media);border-color:var(--media)}
  .badge.src-INVESTING_TR{color:#4a9fd8;border-color:#4a9fd8}
  .badge.src-PARATIC{color:#3fae8f;border-color:#3fae8f}
  .badge.src-DUNYA{color:#c98a3f;border-color:#c98a3f}
  .badge.src-BLOOMBERGHT{color:#8f8fd0;border-color:#8f8fd0}
  .badge.src-FOREKS{color:#c06a9a;border-color:#c06a9a}
  .badge.INFERRED{color:var(--muted);border-color:var(--border);font-size:11px}
  .badge.CATEGORY{color:#9aa7b6;border-color:#596779}
  .badge.IMP-LOW{opacity:.65}
  .badge.IMP-NOTICE{color:var(--warn);border-color:var(--warn)}
  .badge.IMP-IMPORTANT{color:#ff9d4d;border-color:#ff9d4d;font-weight:600}
  .badge.IMP-HIGH{color:#ff6262;border-color:#ff6262;font-weight:700}
  .tick{font-weight:600;color:var(--accent);cursor:pointer}
  .title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .title-row .title-tickers{display:inline-flex;gap:5px;flex-wrap:wrap}
  .title-row .title-tickers .tick{
    padding:2px 6px;border:1px solid rgba(86,156,214,.45);
    border-radius:6px;background:rgba(86,156,214,.08);font-size:12px;
  }
  .summary{color:var(--muted);margin-top:7px;font-size:13.5px}
  .group-title{margin:18px 2px 8px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .group-title:first-child{margin-top:4px}
  .badge.DUP{color:var(--muted);border-color:var(--border)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .err{color:var(--bad)}
  footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PiyasaDesk</h1>
    <span class="sub" id="subtitle">yükleniyor…</span>
  </header>

  <div class="searchbar">
    <input type="text" id="q" placeholder="Hisse kodu — örn. TUPRS" autocomplete="off" list="uni">
    <datalist id="uni"></datalist>
    <button class="primary" id="go">Ara</button>
    <button id="refresh" title="Yeniden yükle">↻</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="chips">
    <span class="chip on" data-kind="">Tüm kaynaklar</span>
    <span class="chip" data-kind="REGULATORY">Sadece KAP</span>
    <span class="chip" data-kind="MEDIA">Sadece medya</span>
    <span class="chip" id="worldchip" title="BIST sembolüne eşleşmeyen genel/dünya medya haberlerini göster">Dünya haberleri</span>
    <span class="chip" id="routinechip" title="Rutin/teknik KAP bildirimlerini akışta göster veya gizle">Rutin KAP’ları göster</span>
    <span class="chip" id="autochip">Otomatik yenile: kapalı</span>
  </div>

  <div class="filters">
    <label class="filterbox" for="importanceFilter">
      <span>Önem</span>
      <select id="importanceFilter">
        <option value="">Tümü</option>
        <option value="HIGH">Yüksek Önem</option>
        <option value="IMPORTANT">Önemli</option>
        <option value="NOTICE">Dikkat</option>
        <option value="LOW">Düşük Öncelik</option>
      </select>
    </label>
    <label class="filterbox" for="categoryFilter">
      <span>Kategori</span>
      <select id="categoryFilter">
        <option value="">Tümü</option>
        <option value="FINANCIALS">Finansal Sonuç</option>
        <option value="CONTRACT_TENDER">İhale / Sözleşme</option>
        <option value="CAPITAL_ACTION">Sermaye İşlemi</option>
        <option value="DIVIDEND">Temettü</option>
        <option value="BUYBACK">Pay Geri Alımı</option>
        <option value="MNA">Birleşme / Satın Alma</option>
        <option value="INVESTMENT_OPERATION">Yatırım / Operasyon</option>
        <option value="LEGAL_REGULATORY">Hukuk / Regülasyon</option>
        <option value="MANAGEMENT_GOVERNANCE">Yönetim / Kurumsal</option>
        <option value="DEBT_CREDIT">Borçlanma / Kredi</option>
        <option value="MARKET_MACRO">Makro / Piyasa</option>
        <option value="OTHER">Diğer</option>
      </select>
    </label>
    <label class="filterbox" for="sortFilter">
      <span>Sırala</span>
      <select id="sortFilter">
        <option value="latest">En yeni</option>
        <option value="importance_desc">Önem: yüksekten</option>
        <option value="importance_asc">Önem: düşükten</option>
      </select>
    </label>
    <span class="filter-note" title="Bu seviye fiyat yönü veya yatırım tavsiyesi değildir.">Önem = bilgi/maddilik sınıfı, yön tahmini değil.</span>
  </div>

  <div class="health" id="health">sağlık durumu yükleniyor…</div>
  <div id="list"></div>
  <footer>Veriler yerel toplayıcıdan okunur. Tam metin için haber başlığına tıklayın.</footer>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle">Yeni izleme listesi</h3>
  <label for="dlgName">Liste adı</label>
  <input type="text" id="dlgName" placeholder="örn. Portföyüm" maxlength="24">
  <label for="dlgTickers">Hisse kodları (virgül veya satır ile ayır)</label>
  <textarea id="dlgTickers" placeholder="TUPRS, ASELS, BIMAS"></textarea>
  <div class="dlg-err" id="dlgErr"></div>
  <div class="dlg-actions">
    <button id="dlgDelete" style="margin-right:auto;color:var(--bad)">Listeyi sil</button>
    <button id="dlgCancel">Vazgeç</button>
    <button class="primary" id="dlgSave">Kaydet</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let kindFilter = "";
let worldOnly = false;
let importanceFilter = "";
let categoryFilter = "";
let sortFilter = "latest";
let autoTimer = null;
let activeList = "";      // "" = tüm haberler
let watchlists = {};
let universeSet = new Set();
const WATCHLISTS_KEY = "piyasadesk_watchlists_v1";
let hideRoutine = true;   // KAP rutin bildirimleri varsayılan GİZLİ
let lastSeen = localStorage.getItem("hhm_last_seen") || "";

function fmtTime(iso){
  if(!iso) return "tarih yok";
  const d = new Date(iso);
  if(isNaN(d)) return "tarih yok";
  const diff = (Date.now() - d.getTime())/60000;
  if(diff < 1) return "az önce";
  if(diff < 60) return Math.floor(diff) + " dk önce";
  if(diff < 1440) return Math.floor(diff/60) + " saat önce";
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}

function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadHealth(){
  try{
    const r = await fetch("/api/health");
    const d = await r.json();
    const h = d.health;
    $("#health").innerHTML = `
      <div class="health-row">
        <span><span class="dot ${h.freshness}"></span><b>Tazelik:</b> ${h.freshness}</span>
        <span><span class="dot ${h.completeness}"></span><b>Bütünlük:</b> ${h.completeness} (${h.healthy_source_count}/${h.total_source_count} kaynak)</span>
        <span style="color:var(--muted)">son toplama: ${fmtTime(d.last_run_at)}</span>
      </div>
      <details>
        <summary>Kaynak detayı</summary>
        ${Object.entries(h.sources||{}).map(([sid,s]) =>
          `<div class="srcline"><span class="dot ${s.status}"></span>${esc(sid)} — ${esc(s.reason)}${s.last_error?` <span class="err">(${esc(String(s.last_error).slice(0,90))})</span>`:""}</div>`
        ).join("") || "<div class='srcline'>kaynak yok</div>"}
      </details>`;
  }catch(e){
    $("#health").innerHTML = `<span class="err">Sağlık durumu okunamadı — collector/API çalışıyor mu?</span>`;
  }
}

async function loadUniverse(){
  try{
    const r = await fetch("/api/universe");
    const d = await r.json();
    universeSet = new Set(d.tickers || []);
    $("#uni").innerHTML = d.tickers.map(t=>`<option value="${t}">`).join("");
    $("#subtitle").textContent = `${d.count} sembol tanımlı`;
  }catch(e){ $("#subtitle").textContent = ""; }
}

function persistWatchlists(){
  localStorage.setItem(WATCHLISTS_KEY, JSON.stringify(watchlists));
}

async function loadWatchlists(){
  try{
    const raw = localStorage.getItem(WATCHLISTS_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    watchlists = {};
    if(parsed && !Array.isArray(parsed) && typeof parsed === "object") {
      for(const [name, values] of Object.entries(parsed)) {
        if(typeof name !== "string" || !Array.isArray(values)) continue;
        watchlists[name] = [...new Set(values
          .filter(x => typeof x === "string")
          .map(x => x.trim().toUpperCase())
          .filter(x => /^[A-Z0-9]{3,6}$/.test(x)))].slice(0,200);
      }
    }
  }catch(e){ watchlists = {}; }
  renderTabs();
}

function renderTabs(){
  const names = Object.keys(watchlists);
  let html = `<span class="tab ${activeList===""?"on":""}" data-list="">Tüm Haberler</span>`;
  html += names.map(n =>
    `<span class="tab ${activeList===n?"on":""}" data-list="${esc(n)}">
      ${esc(n)} <span style="opacity:.6">(${watchlists[n].length})</span>
      <span class="tab-actions">
        <button class="tab-action edit" type="button" title="Listeyi düzenle" aria-label="${esc(n)} listesini düzenle">✎</button>
        <button class="tab-action delete" type="button" title="Listeyi sil" aria-label="${esc(n)} listesini sil">×</button>
      </span>
    </span>`
  ).join("");
  html += `<span class="tab add" id="addList">+ liste</span>`;
  $("#tabs").innerHTML = html;

  document.querySelectorAll(".tab[data-list]").forEach(t => {
    t.onclick = () => {
      activeList = t.dataset.list;
      $("#q").value = "";           // liste sekmesi tek-sembol aramasını geçersiz kılar
      leaveWorldModeForTickerContext();
      setSearchMode("");
      renderTabs(); loadNews();
    };
    if(t.dataset.list){
      t.ondblclick = () => openDialog(t.dataset.list);  // geriye dönük: çift tık da düzenler
      const editBtn = t.querySelector(".tab-action.edit");
      const delBtn = t.querySelector(".tab-action.delete");
      if(editBtn) editBtn.onclick = (e) => { e.stopPropagation(); openDialog(t.dataset.list); };
      if(delBtn) delBtn.onclick = (e) => {
        e.stopPropagation();
        const name = t.dataset.list;
        if(!confirm(`"${name}" listesi silinsin mi?`)) return;
        delete watchlists[name];
        persistWatchlists();
        if(activeList === name) activeList = "";
        renderTabs(); loadNews();
      };
    }
  });
  $("#addList").onclick = () => openDialog(null);
}

function openDialog(name){
  $("#dlgTitle").textContent = name ? `Listeyi düzenle: ${name}` : "Yeni izleme listesi";
  $("#dlgName").value = name || "";
  $("#dlgTickers").value = name ? (watchlists[name]||[]).join(", ") : "";
  $("#dlgErr").textContent = "";
  $("#dlgDelete").style.display = name ? "" : "none";
  $("#dlg").dataset.original = name || "";
  $("#dlg").showModal();
}

async function saveDialog(){
  const name = $("#dlgName").value.trim();
  const tickers = [...new Set($("#dlgTickers").value.split(/[,\s;]+/)
    .map(s=>s.trim().toUpperCase()).filter(Boolean))];
  if(!name){ $("#dlgErr").textContent = "Liste adı boş olamaz."; return; }
  if(name.length > 24){ $("#dlgErr").textContent = "Liste adı en fazla 24 karakter olabilir."; return; }
  if(!/^[A-Za-z0-9ÇĞİÖŞÜçğıöşü _-]{1,24}$/.test(name)){ $("#dlgErr").textContent = "Liste adında geçersiz karakter var."; return; }
  if(!tickers.length){ $("#dlgErr").textContent = "Listeye en az bir hisse kodu eklemelisin."; return; }
  if(tickers.length > 200){ $("#dlgErr").textContent = "Bir listede en fazla 200 sembol olabilir."; return; }
  const unknown = universeSet.size ? tickers.filter(t => !universeSet.has(t)) : [];
  if(unknown.length){ $("#dlgErr").textContent = "Sembol evreninde bulunmayan kod(lar): "+unknown.join(", "); return; }
  const original = $("#dlg").dataset.original;
  if(name !== original && Object.prototype.hasOwnProperty.call(watchlists, name)){
    $("#dlgErr").textContent = `"${name}" adında bir liste zaten var.`; return;
  }
  if(original && original !== name) delete watchlists[original];
  watchlists[name] = tickers;
  persistWatchlists();
  activeList = name;
  leaveWorldModeForTickerContext();
  $("#dlg").close(); renderTabs(); loadNews();
}

async function deleteDialog(){
  const name = $("#dlg").dataset.original;
  if(!name) return;
  if(!confirm(`"${name}" listesi silinsin mi?`)) return;
  delete watchlists[name];
  persistWatchlists();
  if(activeList === name) activeList = "";
  $("#dlg").close(); renderTabs(); loadNews();
}

function dateGroupLabel(iso){
  if(!iso) return "Tarih yok";
  const d = new Date(iso);
  if(isNaN(d)) return "Tarih yok";
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((a-b)/86400000);
  if(days===0) return "Bugün";
  if(days===1) return "Dün";
  return d.toLocaleDateString("tr-TR", {day:"2-digit", month:"long"});
}

function groupLabelForItem(i){
  if(sortFilter.startsWith("importance")){
    return (i.classification||{}).importance_label || "Diğer";
  }
  return dateGroupLabel(i.published_at || i.collected_at || "");
}

function leaveWorldModeForTickerContext(){
  if(!worldOnly) return;
  worldOnly = false;
  $("#worldchip").classList.remove("on");
  const allSources = document.querySelector('.chip[data-kind=""]');
  if(allSources) allSources.classList.add("on");
  kindFilter = "";
}

function beginTickerSearch(){
  activeList = "";
  leaveWorldModeForTickerContext();
  renderTabs();
  setSearchMode("search");
  loadNews();
}

async function loadNews(){
  const t = $("#q").value.trim().toUpperCase();
  const params = new URLSearchParams({limit:"80"});
  if(t) params.set("ticker", t);
  else if(activeList) params.set("tickers", (watchlists[activeList]||[]).join(","));
  if(kindFilter) params.set("source_kind", kindFilter);
  if(worldOnly) params.set("world_only", "true");
  else params.set("hide_world", "true");
  if(hideRoutine) params.set("hide_routine", "true");
  if(importanceFilter) params.set("importance", importanceFilter);
  if(categoryFilter) params.set("category", categoryFilter);
  params.set("sort", sortFilter);
  params.set("dedupe", "true");
  try{
    const r = await fetch("/api/news?"+params);
    const d = await r.json();
    if(!d.items.length){
      let msg;
      if(t) msg = esc(t)+" için kayıt yok.";
      else if(activeList) msg = `"${esc(activeList)}" listesindeki hisseler için kayıt yok.`;
      else msg = "Henüz haber yok.";
      $("#list").innerHTML = `<div class="empty">${msg}<br><span style="font-size:13px">Toplayıcıyı çalıştırdınız mı? <code>python -m haber.collector</code></span></div>`;
      return;
    }
    let newestTs = lastSeen;
    let html = "";
    let lastGroup = null;
    d.items.forEach(i => {
      const group = groupLabelForItem(i);
      if(group !== lastGroup){
        html += `<div class="group-title">${esc(group)}</div>`;
        lastGroup = group;
      }
      const ts = i.published_at || i.collected_at || "";
      const isNew = lastSeen && ts > lastSeen;
      if(ts > newestTs) newestTs = ts;
      const routine = (i.extra||{}).kap_subject_class === "ROUTINE";
      const cls = i.classification || {};
      const reasonTitle = (cls.reasons||[]).join(" • ");
      const dupCount = Number(i.duplicate_count||1);
      const dupSources = (i.duplicate_sources||[]).join(", ");
      html += `
      <div class="item${isNew?" unseen":""}">
        <div class="title-row">
          ${(i.tickers||[]).length ? `<span class="title-tickers">${(i.tickers||[]).map(x=>`<span class="tick" data-t="${esc(x)}">${esc(x)}</span>`).join("")}</span>` : ""}
          <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>
        </div>
        ${i.summary ? `<div class="summary">${esc(i.summary)}</div>` : ""}
        <div class="meta">
          ${isNew ? `<span class="badge yeni">yeni</span>` : ""}
          <span class="badge ${esc(i.source_kind)} src-${esc(i.source_id)}">${esc(i.source_id)}</span>
          ${dupCount>1 ? `<span class="badge DUP" title="${esc(dupSources)}">${dupCount} kaynak</span>` : ""}
          ${cls.importance_label ? `<span class="badge IMP-${esc(cls.importance_level)}" title="${esc(reasonTitle)}">${esc(cls.importance_label)}</span>` : ""}
          ${cls.category_label ? `<span class="badge CATEGORY">${esc(cls.category_label)}</span>` : ""}
          ${routine ? `<span class="badge ROUTINE" title="Rutin/teknik bildirim türü">rutin KAP</span>` : ""}
          ${i.match_confidence==="INFERRED" && (i.tickers||[]).length ? `<span class="badge INFERRED" title="Hisse kodu haberde doğrudan verilmedi; şirket adı/alias eşleşmesiyle bulundu">şirket adından eşleşti</span>` : ""}
          <span style="color:var(--muted)">${fmtTime(ts)}</span>
        </div>
      </div>`;
    });
    $("#list").innerHTML = html;
    if(newestTs && newestTs !== lastSeen){
      localStorage.setItem("hhm_pending_seen", newestTs);
    }
    document.querySelectorAll(".tick").forEach(el =>
      el.onclick = () => { $("#q").value = el.dataset.t; beginTickerSearch(); });
  }catch(e){
    $("#list").innerHTML = `<div class="empty err">API'ye ulaşılamadı.</div>`;
  }
}

function setSearchMode(mode){
  const go = $("#go");
  go.classList.toggle("primary", mode === "search");
}

function refreshAll(){ loadHealth(); loadNews(); }

$("#go").onclick = beginTickerSearch;
$("#refresh").onclick = refreshAll;
$("#q").addEventListener("keydown", e => { if(e.key==="Enter") beginTickerSearch(); });

document.querySelectorAll(".chip[data-kind]").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip[data-kind]").forEach(x=>x.classList.remove("on"));
  $("#worldchip").classList.remove("on");
  worldOnly = false;
  c.classList.add("on");
  kindFilter = c.dataset.kind;
  loadNews();
});

$("#worldchip").onclick = function(){
  document.querySelectorAll(".chip[data-kind]").forEach(x=>x.classList.remove("on"));
  this.classList.add("on");
  kindFilter = "";
  worldOnly = true;
  loadNews();
};

$("#routinechip").onclick = function(){
  hideRoutine = !hideRoutine;
  this.textContent = hideRoutine ? "Rutin KAP’ları göster" : "Rutin KAP’ları gizle";
  this.classList.toggle("on", !hideRoutine);
  loadNews();
};

$("#importanceFilter").onchange = function(){
  importanceFilter = this.value;
  loadNews();
};

$("#categoryFilter").onchange = function(){
  categoryFilter = this.value;
  loadNews();
};

$("#sortFilter").onchange = function(){
  sortFilter = this.value || "latest";
  loadNews();
};

// "Okundu" işaretle: sayfadan ayrılırken en yeni zaman damgası kaydedilir,
// böylece bir sonraki açılışta ondan yenisi "yeni" rozetiyle gelir.
window.addEventListener("beforeunload", () => {
  const p = localStorage.getItem("hhm_pending_seen");
  if(p) localStorage.setItem("hhm_last_seen", p);
});

$("#autochip").onclick = function(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; this.textContent="Otomatik yenile: kapalı"; this.classList.remove("on"); }
  else { autoTimer=setInterval(refreshAll, 60000); this.textContent="Otomatik yenile: 60 sn"; this.classList.add("on"); }
};

$("#dlgSave").onclick = saveDialog;
$("#dlgCancel").onclick = () => $("#dlg").close();
$("#dlgDelete").onclick = deleteDialog;
$("#dlgName").addEventListener("keydown", e => { if(e.key==="Enter") saveDialog(); });

loadUniverse(); loadWatchlists(); refreshAll();

// Service worker: SADECE yuklenebilirlik icin. Onbellek YOK (bkz. sw.js).
// localhost guvenli baglam sayildigi icin HTTPS olmadan da calisir.
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
